name: Refresh prices

on:
  push:
    branches: [main]
  # Scheduled refresh moved to AWS EventBridge + Lambda (reliable cadence) —
  # see infra/lambda-refresh/. GitHub's schedule cron dropped most runs under
  # load, so it is no longer used here. push still deploys UI/code changes.
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and deploy even if no source changed"
        type: boolean
        default: false

# Never let two refreshes overlap; a queued run waits for the current one.
concurrency:
  group: refresh-prices
  cancel-in-progress: false

permissions:
  contents: write   # commit new snapshots + state back to main
  id-token: write   # OIDC token for the AWS role

env:
  BUCKET: awskr-bedrock-pricing
  STATE_BUCKET: awskr-bedrock-pricing-refresh-state
  DIST_ID: E1OQXWKSFOXAF
  AWS_REGION: ap-northeast-2

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Check sources (conditional GETs, ~20 KB)
        id: check
        run: node collector/check-sources.mjs

      - name: Collect + merge (English Pricing -> English Docs -> APIs)
        id: build
        if: steps.check.outputs.offer_changed == 'true' || steps.check.outputs.page_changed == 'true' || steps.check.outputs.docs_changed == 'true' || inputs.force
        run: |
          cp web/pricing.json "$RUNNER_TEMP/prev-pricing.json"
          # Source 1: English Pricing page — literal prices win exact key conflicts.
          node collector/collect-english-pricing.mjs
          # Source 2: English Documentation — release and route/region availability.
          node collector/collect-english-docs.mjs
          # Source 3: Price List APIs — SKU dimensions and all page gaps.
          if [[ "${{ steps.check.outputs.offer_changed }}" == "true" || "${{ inputs.force }}" == "true" ]]; then
            node collector/collect.mjs all
            node collector/parse-abfm.mjs all
          fi
          node collector/merge.mjs

      - name: Publish gate
        if: steps.build.outcome == 'success'
        run: node collector/gate.mjs "$RUNNER_TEMP/prev-pricing.json" web/pricing.json

      # Every model/region/path transition is derived from the two snapshots —
      # no release names are hard-coded. Keeps tombstones for removed models and
      # writes additions/removals/availability changes to the Actions summary.
      - name: Audit model catalog lifecycle
        if: steps.build.outcome == 'success'
        run: node collector/audit-model-catalog.mjs "$RUNNER_TEMP/prev-pricing.json" web/pricing.json

      # The live page is the Cloudscape app (app/): Vite builds one HTML file,
      # then the same injector inlines the dictionary-encoded dataset.
      - name: Build single-file page
        # A main push always publishes code/UI changes. Scheduled runs still
        # build only when the pricing or documentation sources changed.
        if: steps.build.outcome == 'success' || github.event_name == 'push'
        run: |
          npm ci --prefix app --no-audit --no-fund
          npm exec --prefix app -- vite build app
          node collector/build-standalone.mjs --src app/dist/index.html --out dist/bedrock-pricing.html
          node collector/precompress.mjs

      - name: AWS credentials (OIDC, 1h, upload + invalidate only)
        if: steps.build.outcome == 'success' || github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The refresh Lambda cannot run vite, so it re-inlines fresh data into THIS
      # shell. Upload it BEFORE the site deploy so an hourly Lambda run that lands
      # in between already uses the new UI (never the reverse). Needs the
      # SyncLambdaShell statement in infra/lambda-refresh/deploy-role-policy.json;
      # until that is applied the step fails visibly but does not block the deploy.
      - name: Sync UI shell to the refresh Lambda state
        id: shell
        if: steps.build.outcome == 'success' || github.event_name == 'push'
        continue-on-error: true
        run: |
          aws s3 cp app/dist/index.html "s3://$STATE_BUCKET/refresh-state/shell.html" --no-progress
          echo "Lambda shell updated" >> "$GITHUB_STEP_SUMMARY"

      - name: Warn if the shell sync failed
        if: steps.shell.outcome == 'failure'
        run: echo "::warning::Lambda shell was NOT updated -- apply infra/lambda-refresh/deploy-role-policy.json or run seed-state.sh, otherwise the next hourly run reverts the UI."

      - name: Deploy
        if: steps.build.outcome == 'success' || github.event_name == 'push'
        run: |
          # plain + pre-compressed copies; a CloudFront Function picks one per Accept-Encoding
          up() { aws s3 cp "$1" "s3://$BUCKET/$2" --content-type "text/html; charset=utf-8" \
                   --cache-control "public, max-age=300" --no-progress "${@:3}"; }
          up dist/bedrock-pricing.html    index.html
          up dist/bedrock-pricing.html.br index.html.br --content-encoding br
          up dist/bedrock-pricing.html.gz index.html.gz --content-encoding gzip
          aws s3 cp static/robots.txt "s3://$BUCKET/robots.txt" --content-type "text/plain; charset=utf-8" --cache-control "public, max-age=3600" --no-progress
          aws s3 cp static/sitemap.xml "s3://$BUCKET/sitemap.xml" --content-type "application/xml; charset=utf-8" --cache-control "public, max-age=3600" --no-progress
          aws s3 cp static/llms.txt "s3://$BUCKET/llms.txt" --content-type "text/markdown; charset=utf-8" --cache-control "public, max-age=3600" --no-progress
          aws s3 cp static/.well-known/ard.json "s3://$BUCKET/.well-known/ard.json" --content-type "application/ai-catalog+json" --cache-control "public, max-age=3600" --no-progress
          aws s3 cp static/.well-known/ai-catalog.json "s3://$BUCKET/.well-known/ai-catalog.json" --content-type "application/ai-catalog+json" --cache-control "public, max-age=3600" --no-progress
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" \
            --paths "/index.html" "/" "/index.html.br" "/index.html.gz" "/robots.txt" "/sitemap.xml" "/llms.txt" "/.well-known/ard.json" "/.well-known/ai-catalog.json" --query 'Invalidation.Id' --output text

      - name: Note page-only change
        if: steps.check.outputs.page_changed == 'true' && steps.check.outputs.offer_changed != 'true'
        run: echo "AWS pricing page changed; explicit model names were refreshed and price-pending models redeployed." >> "$GITHUB_STEP_SUMMARY"

      # Only commit when something actually changed -- no empty commits every 30 min.
      - name: Commit data back to main
        if: steps.check.outputs.state_dirty == 'true' || steps.build.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ web/pricing.json dist/
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "data: refresh $(jq -r '.as_of | to_entries | map("\(.key)=\(.value)") | join(", ")' web/pricing.json)"
          git push origin HEAD:main
